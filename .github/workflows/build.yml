name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Resolve modules
        run: go mod tidy

      - name: Vet & test
        run: |
          go vet ./...
          go test ./...

      - name: Build
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.0.0-$($env:GITHUB_SHA.Substring(0,7))" }
          $ld = "-s -w -X github.com/MuhammedMakled/iMaker-Group-Endpoint-Agent/internal/config.Version=$ver"
          $env:CGO_ENABLED = "0"
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags "$ld -H=windowsgui" -o dist/ImakerTrayApp.exe ./cmd/agent
          go build -trimpath -ldflags "$ld" -o dist/ImakerAgentService.exe ./cmd/service
          Copy-Item configs/agent.example.json dist/

      - uses: actions/upload-artifact@v4
        with:
          name: imaker-endpoint-agent
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ImakerTrayApp.exe
            dist/ImakerAgentService.exe
            dist/agent.example.json
          generate_release_notes: true
